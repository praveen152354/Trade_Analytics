name: Terraform CI/CD

on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: terraform

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ACCOUNTADMIN
  TF_VAR_grantee_user: ${{ secrets.SNOWFLAKE_USER }}

jobs:
  validate:
    name: fmt / init / validate / plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color
        continue-on-error: false

  # Apply is deliberately NOT run automatically on push — provisioning
  # warehouses/databases from CI on every merge is more blast radius than a
  # small trial-account project needs. Trigger it manually (Actions tab ->
  # "Terraform CI/CD" -> Run workflow) once a plan has been reviewed, or wire
  # this job to `needs: validate` + `if: github.ref == 'refs/heads/main'` if
  # you want it fully automatic.
  apply:
    name: terraform apply (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -auto-approve
