name: Terraform CI/CD

on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: terraform

env:
  # The snowflakedb/snowflake provider (v1.2.3) reads the org/account split,
  # not a combined SNOWFLAKE_ACCOUNT — see .env.example for why.
  SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
  SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ACCOUNTADMIN
  TF_VAR_grantee_user: ${{ secrets.SNOWFLAKE_USER }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  validate:
    name: fmt / init / validate / plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color
        continue-on-error: false

  # Apply is deliberately NOT run automatically on push — provisioning
  # warehouses/databases from CI on every merge is more blast radius than a
  # small trial-account project needs. Trigger it manually (Actions tab ->
  # "Terraform CI/CD" -> Run workflow) once a plan has been reviewed, or wire
  # this job to `needs: validate` + `if: github.ref == 'refs/heads/main'` if
  # you want it fully automatic.
  apply:
    name: terraform apply (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy RAW.GENERATE_TRADE_FILES (managed outside Terraform — see sql/ header comment)
        working-directory: .
        run: |
          pip install -q snowflake-connector-python
          python - <<'PY'
          import os
          import snowflake.connector
          conn = snowflake.connector.connect(
              account=f"{os.environ['SNOWFLAKE_ORGANIZATION_NAME']}-{os.environ['SNOWFLAKE_ACCOUNT_NAME']}",
              user=os.environ["SNOWFLAKE_USER"],
              password=os.environ["SNOWFLAKE_PASSWORD"],
              role="ACCOUNTADMIN",
              warehouse="TRADE_ANALYTICS_WH",
              database="TRADE_ANALYTICS",
              schema="RAW",
          )
          sql = open("terraform/sql/generate_trade_files_procedure.sql", encoding="utf-8").read()
          conn.cursor().execute(sql)
          print("Procedure deployed.")
          PY

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -auto-approve
