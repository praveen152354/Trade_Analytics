version: 2

# BRONZE is the raw landing layer: dbt doesn't create or materialize
# anything here (that's Terraform + the GENERATE_TRADE_FILES Snowpark
# procedure's job — see terraform/main.tf and terraform/orchestration.tf),
# but declaring it as a dbt source gives it a real node in the lineage
# graph (dbt docs / `dbt ls`), documents its columns in one place, and is
# what stg_trades.sql's source() call resolves against. This file existing
# under models/bronze/ — rather than tucked into models/silver/ — is what
# makes the medallion layering in models/ match the physical BRONZE/SILVER/
# GOLD schemas 1:1.

sources:
  - name: bronze
    database: "{{ target.database }}"
    schema: BRONZE
    tables:
      - name: trades_raw
        description: >
          Landing table for raw trade messages copied in from the internal
          stage. Insert-only; one row per file record loaded.
        columns:
          - name: raw_payload
            description: Full trade message as a VARIANT (JSON).
          - name: file_name
            description: Source file the record was copied from.
          - name: loaded_at
            description: Timestamp the row was copied into Snowflake.

      - name: trades_raw_stream
        description: >
          Standard Snowflake stream on BRONZE.TRADES_RAW. Selecting from it
          inside a dbt incremental model's merge/insert statement consumes
          it and advances its offset — this is the "Snowflake feature" used
          to consume newly-arrived trades (see models/silver/stg_trades.sql).
