# Safe to commit: every value is pulled from an environment variable at run
# time via env_var(), so no secret literal ever lives in this file. Used by
# dbt-core locally, inside the Airflow container (DBT_PROFILES_DIR points
# here), and in CI. dbt Cloud ignores this file and uses its own managed
# connection instead.

trade_analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      role: "{{ env_var('SNOWFLAKE_TRANSFORMER_ROLE', 'TRADE_ANALYTICS_TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'TRADE_ANALYTICS') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRADE_ANALYTICS_WH') }}"
      schema: "{{ env_var('SNOWFLAKE_TRANSFORM_SCHEMA', 'ANALYTICS') }}"
      threads: 4
