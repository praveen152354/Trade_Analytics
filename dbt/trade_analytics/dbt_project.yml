name: 'trade_analytics'
version: '1.0.0'
config-version: 2

profile: 'trade_analytics'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Creates (idempotently) the Snowflake masking policies applied to
# fct_trade_status / rpt_trade_report -- see macros/create_masking_policies.sql
# and the `grants`/post_hook config on those two models. Runs before every
# dbt invocation so the policies always exist before a post-hook tries to
# attach one.
on-run-start:
  - "{{ create_masking_policies() }}"

# Medallion architecture: BRONZE (raw landing) -> SILVER (staging +
# business-rule evaluation) -> GOLD (marts + Type-2 SCD snapshot). Folder names
# below are dbt's own organizational convention and don't have to match the
# physical schema names they materialize into (they do here, on purpose).
#
# RBAC: `grants` here is the default for every GOLD object -- read-only to
# TRADE_ANALYTICS_COMPLIANCE (full-fidelity: raw facts, dimensions, the
# rejected-trades audit log). TRADE_ANALYTICS_ANALYST is deliberately NOT
# granted here -- it's added only on fct_trade_status and rpt_trade_report
# (see those models' config), the two objects the masking policies are
# actually attached to. Granting it broadly here would let it query
# fct_valid_trades directly and read NOTIONAL/COUNTERPARTY unmasked,
# defeating the point.
#
# ACCOUNTADMIN is in every `grants` list here for a different reason: it's
# var.bootstrap_role, the owner of the Streamlit app (terraform/streamlit.tf)
# -- a Streamlit app runs with its OWNER's rights, not the viewer's, so it
# needs its own SELECT on whatever it queries. dbt's grants are
# authoritative (it revokes anything not declared, on every run), so this
# can't be granted from Terraform alongside it without the two fighting
# over the same grant -- live-verified as exactly what broke the dashboard
# once ACCOUNTADMIN was missing from a model's declared list here.
models:
  trade_analytics:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: incremental
      +schema: silver
    gold:
      +schema: gold
      +grants:
        select: ["TRADE_ANALYTICS_COMPLIANCE", "ACCOUNTADMIN"]

snapshots:
  trade_analytics:
    +schema: gold
    +grants:
      select: ["TRADE_ANALYTICS_COMPLIANCE", "ACCOUNTADMIN"]

# Static reference data (e.g. product_reference), not generated data --
# lives in GOLD alongside what it describes, same RBAC posture as the rest
# of that schema.
seeds:
  trade_analytics:
    +schema: gold
    +grants:
      select: ["TRADE_ANALYTICS_COMPLIANCE", "ACCOUNTADMIN"]

vars:
  # Earliest timestamp used to seed incremental watermark comparisons.
  epoch_timestamp: '1900-01-01 00:00:00 +0000'

  # Single source of truth for the convert_to_usd() macro (macros/convert_to_usd.sql).
  # Change a rate here and every model using the macro picks it up on the next run.
  fx_rates_to_usd:
    USD: 1.0
    EUR: 1.08
    GBP: 1.27
    JPY: 0.0067
    CHF: 1.12
    AUD: 0.65

  # Bounds for dim_date's date_spine. Generous on purpose: trade_date is
  # "whenever the generator ran" and maturity_date can be up to ~2 years out.
  date_dim_start_date: '2024-01-01'
  date_dim_end_date: '2031-12-31'
